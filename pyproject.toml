[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ormas-monitor"
version = "0.1.0"
description = "Training health checks for PyTorch that run on your machine: per-layer alarms, proven dead channels, optional repair, and a tamper-evident record."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Rokib Al Dhin Raadh", email = "raadh@oxiedo.com" }]
requires-python = ">=3.9"
dependencies = ["torch>=1.13"]
keywords = ["pytorch", "training", "monitoring", "dead neurons", "batchnorm", "audit"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
safetensors = ["safetensors"]
demo = ["torchvision"]
test = ["pytest"]

[project.urls]
Homepage = "https://oxiedo.com"

[project.scripts]
ormas-monitor = "ormas_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
