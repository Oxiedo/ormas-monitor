name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WANDB_MODE: disabled
  HF_HUB_OFFLINE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      # mlflow and wandb are left out to keep CI fast; their tests skip via pytest.importorskip.
      - name: Install package with test extras
        run: pip install -e ".[dev,safetensors,signing,lightning,huggingface,tensorboard,demo]"
      - run: python -c "import torch, ormas_monitor; print('torch', torch.__version__, 'ormas-monitor', ormas_monitor.__version__)"
      - run: pytest -q
      - run: ormas-monitor --version

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
